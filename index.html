<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Calcula tu nota final, lo que necesitas para ganar la materia y simula escenarios." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Calculadora de Notas</title>
    <script>
      // Aplica el tema antes de pintar para evitar un destello del tema equivocado.
      (function () {
        var theme = null;
        try { theme = localStorage.getItem('calculadora-notas:theme'); } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
